# Default policy if no rule matches
defaults:
  allow: true
  # Note: folders are _not_ downloadable by default (assumes no zipfile created)

# Rule list evaluated top-to-bottom; first match wins
rules:
  # block everything under folder 'Rio_Santa_Lucia_Basin/sl_et0' but allow the folder itself to be downloaded
  - match:
      path_glob: "sl_et0"
    allow: true
    reason: "Allow et0 zip to be downloaded" # assumption is filepath to zip is same as folder

  - match:
      path_glob: "*/sl_et0/*"
    allow: false
    reason: "Don't allow files in et0 zip to be downloaded individually"
    
